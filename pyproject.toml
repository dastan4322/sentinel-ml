[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "sentinel-ml"
version = "0.1.0"
description = "Temporal fraud detection, cost-aware decisions, and observable model serving"
requires-python = ">=3.11,<3.14"
dependencies = [
 "numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<1.8",
 "joblib>=1.4,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
 "prometheus-client>=0.21,<1", "matplotlib>=3.9,<4"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]
[project.scripts]
sentinel = "sentinel.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF"]
